name: PTE Guardrails

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend-pte-guardrails:
    name: Backend PTE tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run PTE rules tests
        run: npm run test:pte-rules

      - name: Run PTE contract tests
        run: npm run test:pte-contract

      - name: Run PTE admin flow contract tests
        run: npm run test:pte-admin-flow

      - name: Run PTE objective calibration tests
        run: npm run test:pte-calibration

      - name: Run PTE blueprint validation tests
        run: npm run test:pte-blueprint

      - name: Run PTE publish guard tests
        run: npm run test:pte-publish-guard

      - name: Run PTE objective normalization tests
        run: npm run test:pte-objective

      - name: Run PTE service scoring tests
        run: npm run test:pte-service

      - name: Run PTE listening bundle tests
        run: npm run test:pte-listening-bundle

      - name: Run PTE points rules tests
        run: npm run test:pte-points

      - name: Run PTE points audit
        run: npm run audit:pte-points

  frontend-pte-preview:
    name: Frontend PTE preview tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend PTE preview time tests
        run: npm run test:pte-preview-time
